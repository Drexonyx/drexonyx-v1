services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drexonyx
      POSTGRES_PASSWORD: drexonyx_dev
      POSTGRES_DB: drexonyx_v1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drexonyx -d drexonyx_v1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
