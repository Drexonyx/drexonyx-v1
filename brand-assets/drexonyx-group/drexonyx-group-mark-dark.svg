<?xml version="1.0" encoding="UTF-8"?>
<!--
  DREXONYX GROUP — DX Monogram Mark (Dark Variant)
  Approved Concept D · Creative Bold
  Use on dark/navy backgrounds.
  NOTE: Text-to-paths required before final print/press production.
  Chrome gradient approximates the reference metallic effect;
  full photorealistic rendering requires production finishing in Illustrator/Figma.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 92" fill="none" role="img"
     aria-label="DREXONYX GROUP DX monogram mark">
  <defs>
    <!-- Chrome silver-blue gradient: crisp metallic highlight band simulating photorealistic chrome -->
    <linearGradient id="dg-chrome" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0%"   stop-color="#0E1C38"/>
      <stop offset="16%"  stop-color="#2E4878"/>
      <stop offset="32%"  stop-color="#5878A8"/>
      <stop offset="45%"  stop-color="#A8C8E0"/>
      <stop offset="50%"  stop-color="#F2FAFF"/>
      <stop offset="55%"  stop-color="#B4D0E8"/>
      <stop offset="68%"  stop-color="#506080"/>
      <stop offset="84%"  stop-color="#1C2E50"/>
      <stop offset="100%" stop-color="#091628"/>
    </linearGradient>
    <!-- Secondary chrome gradient: mirrored diagonal for X bars — depth distinction -->
    <linearGradient id="dg-chrome-x" x1="0.9" y1="0" x2="0.1" y2="1">
      <stop offset="0%"   stop-color="#101E3C"/>
      <stop offset="16%"  stop-color="#344E84"/>
      <stop offset="32%"  stop-color="#6080B0"/>
      <stop offset="45%"  stop-color="#B0CDE4"/>
      <stop offset="50%"  stop-color="#EEF8FF"/>
      <stop offset="55%"  stop-color="#A8C4DC"/>
      <stop offset="68%"  stop-color="#445E80"/>
      <stop offset="84%"  stop-color="#182C52"/>
      <stop offset="100%" stop-color="#09162A"/>
    </linearGradient>
    <!-- Blue accent glow: right face of D bow — DREXONYX GROUP brand identity accent -->
    <linearGradient id="dg-blue-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00DDFF"/>
      <stop offset="40%"  stop-color="#1A6FFF"/>
      <stop offset="100%" stop-color="#0033CC"/>
    </linearGradient>
    <!-- Blue vertical sweep: prominent glowing line at right edge of D — reference sweep accent -->
    <linearGradient id="dg-blue-sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00CCFF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00DDFF" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#22EEFF" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#00CCFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </linearGradient>
    <!-- Inner edge taper gradient: D bow wall transition -->
    <linearGradient id="dg-inner-edge" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#1E3260"/>
      <stop offset="50%"  stop-color="#3A5484"/>
      <stop offset="100%" stop-color="#101E3C"/>
    </linearGradient>
  </defs>

  <!-- ═══ D LETTER ═══ -->
  <!-- Outer D shape: left vertical stem + angular faceted right bow -->
  <!-- Points: left-top → right-top → upper bow-facet → max-width → lower bow-facet → right-bottom → left-bottom -->
  <path d="M4,2 L50,2 L68,10 L80,24 L84,46 L80,68 L68,82 L50,90 L4,90 Z"
        fill="url(#dg-chrome)"/>

  <!-- Inner counter void (D aperture) -->
  <path d="M18,16 L50,16 L62,24 L68,38 L70,46 L68,54 L62,68 L50,76 L18,76 Z"
        fill="#07091C"/>

  <!-- Right bow face: thin chrome strip between counter and outer right edge -->
  <!-- Creates the "D bow" wall — slightly different gradient angle for depth -->
  <path d="M62,24 L68,10 L80,24 L84,46 L80,68 L68,82 L62,68 L68,54 L70,46 L68,38 Z"
        fill="url(#dg-inner-edge)"/>

  <!-- Blue accent edge: rightmost face of D — DREXONYX GROUP brand accent color -->
  <path d="M80,24 L88,30 L92,46 L88,62 L80,68 L84,46 Z"
        fill="url(#dg-blue-accent)" opacity="1.0"/>
  <!-- Blue vertical sweep: prominent glowing line at the D/X boundary — reference accent -->
  <rect x="88" y="2" width="5" height="88" rx="2.5"
        fill="url(#dg-blue-sweep)"/>

  <!-- ═══ X LETTER ═══ -->
  <!-- X bar 1: top-left → bottom-right diagonal stroke (\ direction) -->
  <path d="M94,2 L114,2 L166,90 L146,90 Z"
        fill="url(#dg-chrome)"/>

  <!-- X bar 2: top-right → bottom-left diagonal stroke (/ direction) -->
  <path d="M146,2 L166,2 L114,90 L94,90 Z"
        fill="url(#dg-chrome-x)"/>

  <!-- X center junction highlight: brightens the overlap region -->
  <path d="M114,2 L130,46 L114,90 L94,90 L126,46 L94,2 Z"
        fill="#E8F4FF" opacity="0.06"/>
</svg>
