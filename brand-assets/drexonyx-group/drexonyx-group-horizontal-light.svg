<?xml version="1.0" encoding="UTF-8"?>
<!--
  DREXONYX GROUP — Horizontal Lockup (Light Variant)
  Use on white/light backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 92" fill="none" role="img"
     aria-label="DREXONYX GROUP horizontal logo lockup — light">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&amp;display=swap');
      .sg-brand { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="dghl-chrome" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0%"   stop-color="#0A1830"/>
      <stop offset="20%"  stop-color="#1E3460"/>
      <stop offset="40%"  stop-color="#304E80"/>
      <stop offset="58%"  stop-color="#4868A0"/>
      <stop offset="72%"  stop-color="#2A4472"/>
      <stop offset="88%"  stop-color="#162848"/>
      <stop offset="100%" stop-color="#091420"/>
    </linearGradient>
    <linearGradient id="dghl-chrome-x" x1="0.9" y1="0" x2="0.1" y2="1">
      <stop offset="0%"   stop-color="#0C1C38"/>
      <stop offset="45%"  stop-color="#3858A0"/>
      <stop offset="80%"  stop-color="#1A3058"/>
      <stop offset="100%" stop-color="#0A1828"/>
    </linearGradient>
    <linearGradient id="dghl-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0088DD"/>
      <stop offset="45%"  stop-color="#0044BB"/>
      <stop offset="100%" stop-color="#001E88"/>
    </linearGradient>
    <linearGradient id="dghl-inner" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#1A2E50"/>
      <stop offset="60%"  stop-color="#2A3E68"/>
      <stop offset="100%" stop-color="#0E1E34"/>
    </linearGradient>
  </defs>

  <!-- DX mark -->
  <g transform="translate(0,2.5) scale(0.941)">
    <path d="M4,2 L50,2 L68,10 L80,24 L84,46 L80,68 L68,82 L50,90 L4,90 Z"
          fill="url(#dghl-chrome)"/>
    <path d="M18,16 L50,16 L62,24 L68,38 L70,46 L68,54 L62,68 L50,76 L18,76 Z"
          fill="#EEF3FF"/>
    <path d="M62,24 L68,10 L80,24 L84,46 L80,68 L68,82 L62,68 L68,54 L70,46 L68,38 Z"
          fill="url(#dghl-inner)"/>
    <path d="M80,24 L88,30 L92,46 L88,62 L80,68 L84,46 Z"
          fill="url(#dghl-blue)" opacity="0.90"/>
    <path d="M94,2 L114,2 L166,90 L146,90 Z"  fill="url(#dghl-chrome)"/>
    <path d="M146,2 L166,2 L114,90 L94,90 Z"  fill="url(#dghl-chrome-x)"/>
  </g>

  <!-- Divider -->
  <line x1="176" y1="12" x2="176" y2="80" stroke="#0044BB" stroke-width="1" opacity="0.25"/>

  <!-- DREXONYX wordmark -->
  <text x="188" y="44" class="sg-brand"
        font-size="26" font-weight="700" letter-spacing="0.04em"
        fill="#0B0F1E">DREXONYX</text>

  <!-- GROUP sub-label -->
  <line x1="188" y1="55" x2="200" y2="55" stroke="#0044BB" stroke-width="1.2"/>
  <text x="204" y="58" class="sg-brand"
        font-size="11" font-weight="600" letter-spacing="0.18em"
        fill="#304878">GROUP</text>
  <line x1="253" y1="55" x2="265" y2="55" stroke="#0044BB" stroke-width="1.2"/>

  <!-- Tagline -->
  <text x="188" y="72" class="sg-brand"
        font-size="8.5" font-weight="300" letter-spacing="0.20em"
        fill="#6080A0">DIGITAL BUSINESS ECOSYSTEM</text>
</svg>
