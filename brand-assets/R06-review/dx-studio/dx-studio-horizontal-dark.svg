<?xml version="1.0" encoding="UTF-8"?>
<!--
  R06 — DX STUDIO — Horizontal Lockup (Dark Variant)
  Faithfully extracted from approved Concept D reference image.
  RED accent is intentional and approved. Film perforations on X bar 1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 92" fill="none" role="img"
     aria-label="DX STUDIO horizontal logo lockup — dark">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&amp;display=swap');
      .sg-brand { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="r6dxsdh-chrome" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0%"   stop-color="#060C18"/>
      <stop offset="10%"  stop-color="#182840"/>
      <stop offset="26%"  stop-color="#3858A0"/>
      <stop offset="40%"  stop-color="#8CAED0"/>
      <stop offset="48%"  stop-color="#E0F0FF"/>
      <stop offset="51%"  stop-color="#F8FEFF"/>
      <stop offset="56%"  stop-color="#C8DCF0"/>
      <stop offset="70%"  stop-color="#304870"/>
      <stop offset="86%"  stop-color="#101828"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>
    <linearGradient id="r6dxsdh-chrome-x" x1="0.92" y1="0" x2="0.08" y2="1">
      <stop offset="0%"   stop-color="#040A14"/>
      <stop offset="10%"  stop-color="#162238"/>
      <stop offset="26%"  stop-color="#3060A8"/>
      <stop offset="40%"  stop-color="#8AB0D4"/>
      <stop offset="48%"  stop-color="#DCF0FF"/>
      <stop offset="51%"  stop-color="#F4FCFF"/>
      <stop offset="56%"  stop-color="#C0D8EE"/>
      <stop offset="70%"  stop-color="#2C4468"/>
      <stop offset="86%"  stop-color="#0E1826"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>
    <!-- RED accent: intentional, approved -->
    <linearGradient id="r6dxsdh-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF4040"/>
      <stop offset="45%"  stop-color="#E81C2C"/>
      <stop offset="100%" stop-color="#991010"/>
    </linearGradient>
    <linearGradient id="r6dxsdh-play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF3030"/>
      <stop offset="100%" stop-color="#CC0A18"/>
    </linearGradient>
    <linearGradient id="r6dxsdh-bow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#1A2C50"/>
      <stop offset="45%"  stop-color="#304868"/>
      <stop offset="100%" stop-color="#0C1828"/>
    </linearGradient>
    <clipPath id="r6dxsdh-bar1-clip">
      <path d="M94,2 L114,2 L166,90 L146,90 Z"/>
    </clipPath>
    <linearGradient id="r6dxsdh-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8F4FF"/>
      <stop offset="100%" stop-color="#A8C0D8"/>
    </linearGradient>
  </defs>

  <!-- DX STUDIO mark — R06 gradients -->
  <g transform="translate(0,2.5) scale(0.941)">
    <path d="M4,2 L50,2 L68,10 L80,24 L84,46 L80,68 L68,82 L50,90 L4,90 Z"
          fill="url(#r6dxsdh-chrome)"/>
    <path d="M18,16 L50,16 L62,24 L68,38 L70,46 L68,54 L62,68 L50,76 L18,76 Z"
          fill="#07091C"/>
    <path d="M62,24 L68,10 L80,24 L84,46 L80,68 L68,82 L62,68 L68,54 L70,46 L68,38 Z"
          fill="url(#r6dxsdh-bow)"/>
    <path d="M80,24 L88,30 L92,46 L88,62 L80,68 L84,46 Z"
          fill="url(#r6dxsdh-red)" opacity="0.95"/>
    <!-- Play button -->
    <path d="M28,33 L28,59 L57,46 Z" fill="url(#r6dxsdh-play)"/>
    <path d="M28,33 L28,38 L52,46 L28,54 L28,59 L57,46 Z" fill="#FF5050" opacity="0.20"/>
    <!-- X bar 1 -->
    <path d="M94,2 L114,2 L166,90 L146,90 Z" fill="url(#r6dxsdh-chrome)"/>
    <!-- X bar 2 -->
    <path d="M146,2 L166,2 L114,90 L94,90 Z" fill="url(#r6dxsdh-chrome-x)"/>
    <!-- Film perforations -->
    <g clip-path="url(#r6dxsdh-bar1-clip)">
      <rect x="106" y="6"  width="10" height="6" rx="1.5" fill="#030810" opacity="0.75"/>
      <rect x="118" y="22" width="10" height="6" rx="1.5" fill="#030810" opacity="0.75"/>
      <rect x="129" y="38" width="10" height="6" rx="1.5" fill="#030810" opacity="0.75"/>
      <rect x="141" y="54" width="10" height="6" rx="1.5" fill="#030810" opacity="0.75"/>
      <rect x="150" y="68" width="9"  height="6" rx="1.5" fill="#030810" opacity="0.75"/>
      <rect x="157" y="80" width="7"  height="5" rx="1.5" fill="#030810" opacity="0.65"/>
    </g>
  </g>

  <!-- Divider: red accent for DX STUDIO -->
  <line x1="176" y1="12" x2="176" y2="80" stroke="#E81C2C" stroke-width="1" opacity="0.40"/>

  <!-- DX STUDIO wordmark -->
  <text x="188" y="44" class="sg-brand"
        font-size="26" font-weight="700" letter-spacing="0.04em"
        fill="url(#r6dxsdh-text)">DX STUDIO</text>

  <!-- Tagline: pipe-separated -->
  <text x="188" y="62" class="sg-brand"
        font-size="9" font-weight="400" letter-spacing="0.14em"
        fill="#8FA0B4">FILM</text>
  <text x="216" y="62" class="sg-brand"
        font-size="9" fill="#E81C2C" opacity="0.70">|</text>
  <text x="222" y="62" class="sg-brand"
        font-size="9" font-weight="400" letter-spacing="0.14em"
        fill="#8FA0B4">VIDEO</text>
  <text x="257" y="62" class="sg-brand"
        font-size="9" fill="#E81C2C" opacity="0.70">|</text>
  <text x="263" y="62" class="sg-brand"
        font-size="9" font-weight="400" letter-spacing="0.14em"
        fill="#8FA0B4">CREATIVE CONTENT</text>
</svg>
