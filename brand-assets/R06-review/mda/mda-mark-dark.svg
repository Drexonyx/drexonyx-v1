<?xml version="1.0" encoding="UTF-8"?>
<!--
  R06 — MDA — Master Digital Agency Mark (Dark Variant)
  Faithfully extracted from approved Concept D reference image.
  Three ascending signal bars + cyan arc. No tagline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img"
     aria-label="MDA Master Digital Agency mark">
  <defs>
    <linearGradient id="r6mda-b1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#18CCFF"/>
      <stop offset="45%"  stop-color="#1050EE"/>
      <stop offset="100%" stop-color="#003ACC"/>
    </linearGradient>
    <linearGradient id="r6mda-b2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#22D4FF"/>
      <stop offset="45%"  stop-color="#1A60F4"/>
      <stop offset="100%" stop-color="#0040D8"/>
    </linearGradient>
    <linearGradient id="r6mda-b3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#2CDCFF"/>
      <stop offset="40%"  stop-color="#1A6FFF"/>
      <stop offset="100%" stop-color="#0048E0"/>
    </linearGradient>
  </defs>
  <!-- Three ascending signal bars — from reference -->
  <rect x="2"  y="30" width="11" height="22" rx="2.5" fill="url(#r6mda-b1)"/>
  <rect x="17" y="18" width="11" height="34" rx="2.5" fill="url(#r6mda-b2)"/>
  <rect x="32" y="6"  width="11" height="46" rx="2.5" fill="url(#r6mda-b3)"/>
  <!-- Cyan arc sweeping from lower-left to upper-right — from reference -->
  <path d="M 1,46 C 12,2 36,2 54,14"
        stroke="#00C4FF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
