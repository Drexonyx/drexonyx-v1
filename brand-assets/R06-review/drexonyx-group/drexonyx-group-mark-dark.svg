<?xml version="1.0" encoding="UTF-8"?>
<!--
  R06 — DREXONYX GROUP — DX Monogram Mark (Dark Variant)
  Faithfully extracted from approved Concept D reference image.
  Chrome: high-contrast linear-gradient approximation of AI-rendered metallic finish.
  Photorealistic chrome cannot be reproduced exactly in 2D SVG — limitation documented.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 92" fill="none" role="img"
     aria-label="DREXONYX GROUP DX monogram mark">
  <defs>
    <!-- Chrome: very high contrast, near-white peak, deep navy-black edges — matches reference -->
    <linearGradient id="r6dg-chrome" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0%"   stop-color="#060C18"/>
      <stop offset="10%"  stop-color="#182840"/>
      <stop offset="26%"  stop-color="#3858A0"/>
      <stop offset="40%"  stop-color="#8CAED0"/>
      <stop offset="48%"  stop-color="#E0F0FF"/>
      <stop offset="51%"  stop-color="#F8FEFF"/>
      <stop offset="56%"  stop-color="#C8DCF0"/>
      <stop offset="70%"  stop-color="#304870"/>
      <stop offset="86%"  stop-color="#101828"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>
    <!-- Chrome-X: mirrored diagonal, same contrast range -->
    <linearGradient id="r6dg-chrome-x" x1="0.92" y1="0" x2="0.08" y2="1">
      <stop offset="0%"   stop-color="#040A14"/>
      <stop offset="10%"  stop-color="#162238"/>
      <stop offset="26%"  stop-color="#3060A8"/>
      <stop offset="40%"  stop-color="#8AB0D4"/>
      <stop offset="48%"  stop-color="#DCF0FF"/>
      <stop offset="51%"  stop-color="#F4FCFF"/>
      <stop offset="56%"  stop-color="#C0D8EE"/>
      <stop offset="70%"  stop-color="#2C4468"/>
      <stop offset="86%"  stop-color="#0E1826"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>
    <!-- Blue accent: right face of D bow — reference shows cyan-to-blue glow -->
    <linearGradient id="r6dg-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00E0FF"/>
      <stop offset="35%"  stop-color="#1A6FFF"/>
      <stop offset="100%" stop-color="#0030CC"/>
    </linearGradient>
    <!-- D bow wall: narrow chrome strip between counter and outer edge -->
    <linearGradient id="r6dg-bow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#1A2C50"/>
      <stop offset="45%"  stop-color="#304868"/>
      <stop offset="100%" stop-color="#0C1828"/>
    </linearGradient>
  </defs>

  <!-- D outer: left stem + angular faceted bow -->
  <path d="M4,2 L50,2 L68,10 L80,24 L84,46 L80,68 L68,82 L50,90 L4,90 Z"
        fill="url(#r6dg-chrome)"/>
  <!-- D counter: dark void -->
  <path d="M18,16 L50,16 L62,24 L68,38 L70,46 L68,54 L62,68 L50,76 L18,76 Z"
        fill="#07091C"/>
  <!-- D bow wall: thin chrome strip -->
  <path d="M62,24 L68,10 L80,24 L84,46 L80,68 L68,82 L62,68 L68,54 L70,46 L68,38 Z"
        fill="url(#r6dg-bow)"/>
  <!-- Blue accent: rightmost face of D — from reference -->
  <path d="M80,24 L88,30 L92,46 L88,62 L80,68 L84,46 Z"
        fill="url(#r6dg-blue)"/>

  <!-- X bar 1: \ diagonal -->
  <path d="M94,2 L114,2 L166,90 L146,90 Z"
        fill="url(#r6dg-chrome)"/>
  <!-- X bar 2: / diagonal -->
  <path d="M146,2 L166,2 L114,90 L94,90 Z"
        fill="url(#r6dg-chrome-x)"/>
  <!-- X center junction: subtle brightening where bars overlap -->
  <path d="M114,2 L130,46 L114,90 L94,90 L126,46 L94,2 Z"
        fill="#F0F8FF" opacity="0.05"/>
</svg>
