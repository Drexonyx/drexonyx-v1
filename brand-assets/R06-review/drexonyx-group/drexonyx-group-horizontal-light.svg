    <path d="M94,2 L114,2 L166,90 L146,90 Z"  fill="url(#r6dglh-chrome)"/>
    <path d="M146,2 L166,2 L114,90 L94,90 Z"  fill="url(#r6dglh-chrome-x)"/>
  </g>

  <!-- Divider -->
  <line x1="176" y1="12" x2="176" y2="80" stroke="#0044BB" stroke-width="1" opacity="0.25"/>

  <!-- DREXONYX wordmark -->
  <text x="188" y="44" class="sg-brand"
