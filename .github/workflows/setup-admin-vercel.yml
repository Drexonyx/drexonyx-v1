name: Configure Admin Vercel Project

# Configures all required environment variables on the drexonyx-v1-admin Vercel
# project and triggers a production deployment.
#
# Prerequisites before running:
#   1. Create the drexonyx-v1-admin project in the Vercel dashboard:
#      - New Project → Import Git Repo → Drexonyx/drexonyx-v1
#      - Project name: drexonyx-v1-admin
#      - Do NOT set any env vars in the wizard; this workflow sets them.
#      - Do NOT deploy yet; cancel the initial deploy or let it fail.
#
#   2. Add these GitHub repository secrets (Settings → Secrets → Actions):
#
#      VERCEL_TOKEN            — Vercel personal access token
#                                (vercel.com/account/tokens → Create Token)
#
#      ADMIN_DATABASE_URL      — Production Neon connection string
#                                (copy DATABASE_URL from drexonyx-v1 Vercel project)
#
#      ADMIN_AUTH_SECRET       — Auth.js secret
#                                (copy AUTH_SECRET from drexonyx-v1 Vercel project)
#
#      ADMIN_LOGIN_PASSWORD_HASH — bcrypt hash of the operator passphrase (cost 12)
#                                  Generate: node -e "require('bcryptjs').hash('YOUR_PASSPHRASE',12).then(h=>console.log(h))"
#
#      ADMIN_SESSION_SECRET    — Random HMAC key for admin session tokens
#                                Generate: openssl rand -base64 32
#
#   3. Run this workflow (Actions → Configure Admin Vercel Project → Run workflow)
#      and type SET in the confirm field.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SET to confirm setting env vars on drexonyx-v1-admin"
        required: true
        type: string

permissions:
  contents: read

jobs:
  configure:
    name: Set env vars and deploy drexonyx-v1-admin
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'SET'

    steps:
      - name: Set non-secret environment variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TEAM_ID="team_qqKMKFtQjrjZIjlth9LBDNu0"
          PROJECT="drexonyx-v1-admin"

          set_plain() {
            local key="$1" value="$2"
            local json_value envid
            json_value=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "$value")
            envid=$(curl -s \
              "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); r=[e['id'] for e in d.get('envs',[]) if e['key']==sys.argv[1]]; print(r[0] if r else '')" "${key}")
            echo "  → envid for ${key}: '${envid}'"
            if [ -n "$envid" ]; then
              curl -s --fail-with-body -X PATCH \
                "https://api.vercel.com/v10/projects/${PROJECT}/env/${envid}?teamId=${TEAM_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"value\":${json_value},\"type\":\"plain\",\"target\":[\"production\"]}"
            else
              curl -s --fail-with-body -X POST \
                "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"${key}\",\"value\":${json_value},\"type\":\"plain\",\"target\":[\"production\"]}"
            fi
            echo "  ✓ ${key}"
          }

          echo "Setting non-secret env vars..."

          # ENABLE_ADMIN_ROUTES: always delete-then-recreate as plain to prevent
          # a previously-stored sensitive type from masking the value and causing
          # the proxy to return 404 on all /admin/* routes.
          envid_ear=$(curl -s \
            "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); r=[e['id'] for e in d.get('envs',[]) if e['key']=='ENABLE_ADMIN_ROUTES']; print(r[0] if r else '')")
          if [ -n "$envid_ear" ]; then
            echo "  → Deleting existing ENABLE_ADMIN_ROUTES (id: ${envid_ear})..."
            curl -s --fail-with-body -X DELETE \
              "https://api.vercel.com/v10/projects/${PROJECT}/env/${envid_ear}?teamId=${TEAM_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}"
            echo "  → Deleted."
          fi
          curl -s --fail-with-body -X POST \
            "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"key":"ENABLE_ADMIN_ROUTES","value":"true","type":"plain","target":["production"]}'
          echo "  ✓ ENABLE_ADMIN_ROUTES (created)"

          # Verify ENABLE_ADMIN_ROUTES was stored as plain type.
          python3 -c "
          import json, subprocess, sys
          result = subprocess.run(
            ['curl', '-s',
             'https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM_ID}',
             '-H', 'Authorization: Bearer ${VERCEL_TOKEN}'],
            capture_output=True, text=True
          )
          d = json.loads(result.stdout)
          matches = [e for e in d.get('envs', []) if e['key'] == 'ENABLE_ADMIN_ROUTES']
          if not matches:
              print('FAIL: ENABLE_ADMIN_ROUTES not found after creation')
              sys.exit(1)
          e = matches[0]
          t = e.get('type', 'unknown')
          print(f'  verify: ENABLE_ADMIN_ROUTES type={t} id={e[\"id\"]}')
          if t != 'plain':
              print(f'FAIL: expected type=plain, got type={t}')
              sys.exit(1)
          print('  ✓ ENABLE_ADMIN_ROUTES verified as plain type')
          "

          set_plain DREXONYX_ORG_ID "63b642fd-38f6-48ea-b9b1-ca2cbb4c3810"
          set_plain AUTH_URL "https://drexonyx-v1-admin.vercel.app"

      - name: Set secret environment variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          ADMIN_AUTH_SECRET: ${{ secrets.ADMIN_AUTH_SECRET }}
          ADMIN_LOGIN_PASSWORD_HASH: ${{ secrets.ADMIN_LOGIN_PASSWORD_HASH }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: |
          set -euo pipefail
          TEAM_ID="team_qqKMKFtQjrjZIjlth9LBDNu0"
          PROJECT="drexonyx-v1-admin"

          set_secret() {
            local key="$1" value="$2"
            local json_value envid
            json_value=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "$value")
            envid=$(curl -s \
              "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); r=[e['id'] for e in d.get('envs',[]) if e['key']==sys.argv[1]]; print(r[0] if r else '')" "${key}")
            echo "  → envid for ${key}: '${envid}'"
            if [ -n "$envid" ]; then
              curl -s --fail-with-body -X PATCH \
                "https://api.vercel.com/v10/projects/${PROJECT}/env/${envid}?teamId=${TEAM_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"value\":${json_value},\"target\":[\"production\"]}"
            else
              curl -s --fail-with-body -X POST \
                "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"${key}\",\"value\":${json_value},\"type\":\"encrypted\",\"target\":[\"production\"]}"
            fi
            echo "  ✓ ${key}"
          }

          echo "Setting secret env vars..."
          set_secret DATABASE_URL "$ADMIN_DATABASE_URL"
          set_secret AUTH_SECRET "$ADMIN_AUTH_SECRET"
          set_secret ADMIN_LOGIN_PASSWORD_HASH "$ADMIN_LOGIN_PASSWORD_HASH"
          set_secret ADMIN_SESSION_SECRET "$ADMIN_SESSION_SECRET"

      - name: Set Node.js version to 24.x
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TEAM_ID="team_qqKMKFtQjrjZIjlth9LBDNu0"
          PROJECT="drexonyx-v1-admin"
          echo "Setting Node.js version to 24.x..."
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/${PROJECT}?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"nodeVersion":"24.x"}' | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print('nodeVersion:', d.get('nodeVersion','(not returned)'))"
          echo "  ✓ Node.js version set to 24.x"

      - name: Trigger production deployment and wait for Ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TEAM_ID="team_qqKMKFtQjrjZIjlth9LBDNu0"
          echo "Triggering production deployment of drexonyx-v1-admin from main..."
          DEPLOY_RESPONSE=$(curl -sf -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${TEAM_ID}&forceNew=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "drexonyx-v1-admin",
              "gitSource": {
                "type": "github",
                "org": "Drexonyx",
                "repo": "drexonyx-v1",
                "ref": "main"
              },
              "target": "production"
            }')
          DEPLOY_URL=$(echo "$DEPLOY_RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('url',''))")
          DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))")
          echo "Deployment URL: ${DEPLOY_URL}"
          echo "Deployment ID:  ${DEPLOY_ID}"

          echo "Waiting for deployment to become Ready (timeout 10 min)..."
          for i in $(seq 1 30); do
            sleep 20
            STATUS=$(curl -s \
              "https://api.vercel.com/v13/deployments/${DEPLOY_ID}?teamId=${TEAM_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','UNKNOWN'))")
            echo "  [${i}/30] status=${STATUS}"
            if [ "$STATUS" = "READY" ]; then
              echo "  ✓ Deployment READY"
              break
            elif [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "  ✗ Deployment failed with status: ${STATUS}"
              echo "  Check logs at: https://vercel.com/drexonyxstudio-7806/drexonyx-v1-admin"
              exit 1
            fi
          done
          if [ "$STATUS" != "READY" ]; then
            echo "  ✗ Deployment did not reach READY within 10 minutes (last status: ${STATUS})"
            exit 1
          fi

          echo "Verifying /admin/login endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://drexonyx-v1-admin.vercel.app/admin/login")
          echo "  /admin/login HTTP status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  ✓ /admin/login returned 200 OK"
          else
            echo "  ✗ /admin/login returned ${HTTP_STATUS} (expected 200)"
            echo "  Note: This may be a propagation delay — check manually at https://drexonyx-v1-admin.vercel.app/admin/login"
            exit 1
          fi
          echo "Production URL: https://drexonyx-v1-admin.vercel.app"
