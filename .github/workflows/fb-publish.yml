name: Facebook Direct Publish

# Manual trigger only — Claude Code dispatches this when a post is ready.
# Inputs are the ONLY way to initiate a publish; no push or schedule trigger.
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Post caption / text'
        required: true
        type: string
      image_path:
        description: 'Repo-relative path to image file (leave empty for text-only post)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Validate credential only — do not publish'
        required: false
        default: false
        type: boolean

# Minimal permissions — this workflow reads repo contents and does nothing else
# with the GitHub token. All Facebook access uses META_PAGE_ACCESS_TOKEN secret.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to Facebook Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Validate the credential before attempting any publish.
      # Calls /me and /me/accounts — no post is created.
      # The token value is never printed; GitHub Actions masks registered secrets.
      - name: Validate Meta credential
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID_1: ${{ secrets.META_PAGE_ID_1 }}
        run: node scripts/fb-publish.mjs --validate

      # Text-only publish — skipped when dry_run is true or image_path is set.
      # POST_MESSAGE is set as an env var — never interpolated into the shell string.
      - name: Publish text post to Facebook Page
        if: ${{ !inputs.dry_run && inputs.image_path == '' }}
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID_1: ${{ secrets.META_PAGE_ID_1 }}
          POST_MESSAGE: ${{ inputs.message }}
        run: node scripts/fb-publish.mjs "$POST_MESSAGE"

      # Image post — skipped when dry_run is true or image_path is empty.
      # IMAGE_PATH points to a file checked out from the repo (no external URL).
      # POST_MESSAGE is set as an env var — never interpolated into the shell string.
      - name: Publish image post to Facebook Page
        if: ${{ !inputs.dry_run && inputs.image_path != '' }}
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID_1: ${{ secrets.META_PAGE_ID_1 }}
          IMAGE_PATH: ${{ inputs.image_path }}
          POST_MESSAGE: ${{ inputs.message }}
        run: node scripts/fb-publish.mjs --image-post "$POST_MESSAGE"
