name: Database Migration

# The Drizzle migration journal (db/migrations/meta/_journal.json) only covers
# migrations 0000–0008. 29 SQL files exist on disk (0000–0027 plus
# 0008_orchestration_schema.sql applied outside drizzle-kit). The journal
# integrity check step below will FAIL and block migration until the journal
# is repaired to account for all SQL files.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to confirm execution against the production database'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Drizzle Migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'MIGRATE'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify journal integrity
        run: |
          set -e
          JOURNAL_COUNT=$(jq '.entries | length' db/migrations/meta/_journal.json)
          SQL_COUNT=$(ls db/migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')
          echo "Journal entries: $JOURNAL_COUNT"
          echo "SQL files on disk: $SQL_COUNT"
          if [ "$JOURNAL_COUNT" -ne "$SQL_COUNT" ]; then
            echo ""
            echo "ERROR: Journal has $JOURNAL_COUNT entries but $SQL_COUNT SQL files exist."
            echo "SQL files not referenced in the journal:"
            for f in db/migrations/*.sql; do
              tag=$(basename "$f" .sql)
              if ! jq -e --arg tag "$tag" '.entries[] | select(.tag == $tag)' \
                   db/migrations/meta/_journal.json > /dev/null 2>&1; then
                echo "  - $tag"
              fi
            done
            echo ""
            echo "BLOCKED: Repair the journal before running migrations."
            exit 1
          fi
          echo "Journal integrity check PASSED."

      - name: Run Drizzle migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Migration complete
        run: echo "Migration step finished. Verify drizzle.__drizzle_migrations in the Neon console."
