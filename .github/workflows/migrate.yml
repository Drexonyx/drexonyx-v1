name: Database Migration

# WARNING: The Drizzle migration journal (db/migrations/meta/_journal.json) only covers
# migrations 0000–0008. 28 SQL files exist on disk (0000–0027). Running drizzle-kit migrate
# against a database that has already applied 0009–0027 outside the journal will produce
# unpredictable results. Verify the journal and migration state in Neon before triggering.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to confirm execution against the production database'
        required: true
        type: string
      journal_verified:
        description: 'WARNING: journal only covers 0000–0008 but 28 SQL files exist. Type JOURNAL_OK to confirm you have verified migration state in Neon first.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Drizzle Migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'MIGRATE' && github.event.inputs.journal_verified == 'JOURNAL_OK'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Drizzle migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Migration complete
        run: echo "Migration step finished. Verify drizzle.__drizzle_migrations in the Neon console."
