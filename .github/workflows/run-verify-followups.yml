name: Verify & Fix Follow-ups (one-shot via Vercel)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check = read only | create = insert missing follow-ups'
        required: true
        default: 'check'
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify follow-ups for DXB Market & Creative Shelf LLC
    runs-on: ubuntu-latest

    steps:
      - name: Call Vercel verify-followups endpoint
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.drexonyx.com/api/internal/verify-followups?action=${{ github.event.inputs.action }}")
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.json
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo ""
            python3 -m json.tool /tmp/response.json
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Error: HTTP $HTTP_CODE"
            exit 1
          fi
