<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <defs>

    <!-- FILTERS -->
    <filter id="b1" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="b3" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b7" x="-8%" y="-8%" width="116%" height="116%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="b14" x="-12%" y="-12%" width="124%" height="124%"><feGaussianBlur stdDeviation="14"/></filter>
    <!-- Film grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncR type="linear" slope="0.06" intercept="0.47"/>
        <feFuncG type="linear" slope="0.06" intercept="0.47"/>
        <feFuncB type="linear" slope="0.06" intercept="0.47"/>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
    </filter>

    <!-- GRADIENTS -->
    <!-- Sky warm gold atmosphere (upper right source) -->
    <radialGradient id="skyGold" cx="88%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#3e2700" stop-opacity="0.82"/>
      <stop offset="40%" stop-color="#1a0f00" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#060609" stop-opacity="0"/>
    </radialGradient>
    <!-- Secondary cooler atmosphere centre-left -->
    <radialGradient id="skyBlue" cx="15%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#060812" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#060609" stop-opacity="0"/>
    </radialGradient>
    <!-- Ground warm street reflection -->
    <radialGradient id="ground" cx="62%" cy="96%" r="50%">
      <stop offset="0%" stop-color="#22160a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#060609" stop-opacity="0"/>
    </radialGradient>
    <!-- Primary diagonal gold shaft (upper right → lower left) -->
    <linearGradient id="shaft1" x1="1" y1="0" x2="0.22" y2="1">
      <stop offset="0%" stop-color="#C8980A" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#C8980A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C8980A" stop-opacity="0"/>
    </linearGradient>
    <!-- Secondary softer shaft -->
    <linearGradient id="shaft2" x1="1" y1="0.08" x2="0.48" y2="1">
      <stop offset="0%" stop-color="#7a5800" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7a5800" stop-opacity="0"/>
    </linearGradient>
    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <!-- Anamorphic lens flare (horizontal, peaks around x=72%) -->
    <linearGradient id="flare" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#C8980A" stop-opacity="0"/>
      <stop offset="48%"  stop-color="#C8980A" stop-opacity="0.05"/>
      <stop offset="66%"  stop-color="#e8b820" stop-opacity="0.48"/>
      <stop offset="70%"  stop-color="#fff5b0" stop-opacity="0.92"/>
      <stop offset="73%"  stop-color="#e8b820" stop-opacity="0.42"/>
      <stop offset="85%"  stop-color="#C8980A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C8980A" stop-opacity="0"/>
    </linearGradient>
    <!-- Figure rim light (gold from upper-right) -->
    <linearGradient id="rim1" x1="1" y1="0.15" x2="0" y2="1">
      <stop offset="0%"  stop-color="#C8980A" stop-opacity="1"/>
      <stop offset="5%"  stop-color="#b08808" stop-opacity="0.85"/>
      <stop offset="16%" stop-color="#0d0d0d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060606" stop-opacity="1"/>
    </linearGradient>
    <!-- Figure 2 rim (slightly dimmer) -->
    <linearGradient id="rim2" x1="0.92" y1="0.18" x2="0.08" y2="1">
      <stop offset="0%"  stop-color="#C8980A" stop-opacity="0.78"/>
      <stop offset="10%" stop-color="#0c0c0c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060606" stop-opacity="1"/>
    </linearGradient>
    <!-- Hair gold catch -->
    <linearGradient id="hairG" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0%"  stop-color="#C8980A" stop-opacity="0.78"/>
      <stop offset="30%" stop-color="#0a0808" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </linearGradient>
    <!-- Ground reflections -->
    <linearGradient id="groundLine" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#C8980A" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#C8980A" stop-opacity="0.07"/>
      <stop offset="65%"  stop-color="#C8980A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C8980A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ======================================================= -->
  <!-- BASE BACKGROUND                                          -->
  <!-- ======================================================= -->
  <rect width="960" height="600" fill="#050508"/>
  <rect width="960" height="600" fill="url(#skyGold)"/>
  <rect width="960" height="600" fill="url(#skyBlue)"/>
  <rect width="960" height="600" fill="url(#ground)"/>

  <!-- ======================================================= -->
  <!-- SKYLINE — 3 DEPTH LAYERS                                 -->
  <!-- ======================================================= -->

  <!-- Layer 1: Far distant (very blurry, barely visible) -->
  <g filter="url(#b14)" opacity="0.20" fill="#1a1a22">
    <rect x="0"   y="278" width="38"  height="322"/>
    <rect x="46"  y="252" width="26"  height="348"/>
    <rect x="80"  y="265" width="44"  height="335"/>
    <rect x="132" y="225" width="24"  height="375"/>
    <rect x="164" y="240" width="36"  height="360"/>
    <polygon points="218,130 228,260 208,260"/><rect x="208" y="260" width="20" height="340"/>
    <rect x="236" y="244" width="34"  height="356"/>
    <rect x="278" y="215" width="40"  height="385"/>
    <rect x="326" y="255" width="26"  height="345"/>
    <polygon points="370,90 377,228 363,228"/><rect x="363" y="228" width="14" height="372"/>
    <rect x="385" y="242" width="36"  height="358"/>
    <rect x="429" y="257" width="28"  height="343"/>
    <rect x="465" y="220" width="42"  height="380"/>
    <rect x="515" y="250" width="30"  height="350"/>
    <rect x="553" y="236" width="46"  height="364"/>
    <rect x="607" y="259" width="28"  height="341"/>
    <rect x="643" y="228" width="38"  height="372"/>
    <rect x="689" y="246" width="34"  height="354"/>
    <rect x="731" y="255" width="42"  height="345"/>
    <rect x="781" y="226" width="28"  height="374"/>
    <rect x="817" y="248" width="40"  height="352"/>
    <rect x="865" y="265" width="26"  height="335"/>
    <rect x="899" y="242" width="30"  height="358"/>
    <rect x="937" y="255" width="23"  height="345"/>
  </g>

  <!-- Layer 2: Mid-distance (moderate blur) -->
  <g filter="url(#b7)" opacity="0.36" fill="#0e0e18">
    <!-- Burj Khalifa-inspired tapered spire -->
    <polygon points="162,148 170,280 154,280"/>
    <polygon points="154,280 164,390 144,390"/>
    <rect x="144" y="390" width="20" height="210"/>
    <!-- Frame / ladder tower -->
    <rect x="196" y="292" width="7"   height="308"/>
    <rect x="230" y="292" width="7"   height="308"/>
    <rect x="196" y="292" width="41"  height="11"/>
    <rect x="196" y="366" width="41"  height="9"/>
    <rect x="196" y="442" width="41"  height="9"/>
    <!-- Setback tower (stepped) -->
    <rect x="252" y="302" width="42"  height="298"/>
    <rect x="256" y="260" width="34"  height="42"/>
    <rect x="259" y="226" width="28"  height="34"/>
    <!-- Twin towers -->
    <rect x="306" y="275" width="22"  height="325"/>
    <rect x="336" y="275" width="22"  height="325"/>
    <rect x="306" y="275" width="52"  height="11"/>
    <!-- Diamond cap -->
    <polygon points="396,240 412,282 380,282"/>
    <rect x="380" y="282" width="32"  height="318"/>
    <!-- Dramatic centre-right tapered spire -->
    <polygon points="538,145 550,275 526,275"/>
    <rect x="526" y="275" width="24"  height="325"/>
    <!-- Stepped right-sector building -->
    <rect x="580" y="295" width="38"  height="305"/>
    <rect x="584" y="260" width="30"  height="35"/>
    <rect x="588" y="232" width="22"  height="28"/>
    <!-- Right cluster -->
    <rect x="638" y="305" width="34"  height="295"/>
    <rect x="680" y="282" width="46"  height="318"/>
    <rect x="734" y="298" width="36"  height="302"/>
    <rect x="778" y="275" width="50"  height="325"/>
    <rect x="836" y="295" width="42"  height="305"/>
    <rect x="886" y="282" width="28"  height="318"/>
    <rect x="922" y="305" width="38"  height="295"/>
  </g>

  <!-- Layer 3: Near foreground buildings (minimal blur, most defined) -->
  <g filter="url(#b3)" opacity="0.50" fill="#090912">
    <!-- Left block -->
    <rect x="0"   y="342" width="50"  height="258"/>
    <rect x="58"  y="325" width="36"  height="275"/>
    <!-- Glass tower (with implied floor lines) -->
    <rect x="102" y="315" width="53"  height="285"/>
    <rect x="104" y="333" width="49"  height="2" fill="#14141e" opacity="0.6"/>
    <rect x="104" y="355" width="49"  height="2" fill="#14141e" opacity="0.6"/>
    <rect x="104" y="377" width="49"  height="2" fill="#14141e" opacity="0.6"/>
    <rect x="104" y="399" width="49"  height="2" fill="#14141e" opacity="0.6"/>
    <rect x="104" y="421" width="49"  height="2" fill="#14141e" opacity="0.6"/>
    <rect x="104" y="443" width="49"  height="2" fill="#14141e" opacity="0.6"/>
    <!-- Far right block (beyond figures) -->
    <rect x="852" y="332" width="108" height="268"/>
    <rect x="854" y="350" width="104" height="2" fill="#14141e" opacity="0.5"/>
    <rect x="854" y="372" width="104" height="2" fill="#14141e" opacity="0.5"/>
    <rect x="854" y="394" width="104" height="2" fill="#14141e" opacity="0.5"/>
    <rect x="854" y="416" width="104" height="2" fill="#14141e" opacity="0.5"/>
  </g>

  <!-- Street / ground level -->
  <rect x="0" y="465" width="960" height="135" fill="#030306"/>
  <!-- Wet street gold reflections -->
  <rect x="0" y="478" width="960" height="3" fill="url(#groundLine)"/>
  <ellipse cx="680" cy="495" rx="140" ry="12" fill="#C8980A" opacity="0.05" filter="url(#b7)"/>
  <ellipse cx="540" cy="490" rx="90"  ry="8"  fill="#C8980A" opacity="0.04" filter="url(#b7)"/>

  <!-- ======================================================= -->
  <!-- GOLD LIGHT SHAFTS                                        -->
  <!-- ======================================================= -->
  <!-- Primary shaft -->
  <polygon points="960,0 960,420 520,600 710,0" fill="url(#shaft1)" filter="url(#b7)"/>
  <!-- Secondary broader shaft -->
  <polygon points="960,0 960,210 650,600 835,0" fill="url(#shaft2)" filter="url(#b14)"/>
  <!-- Tight bright source near upper-right corner -->
  <ellipse cx="920" cy="30" rx="55" ry="38" fill="#C8980A" opacity="0.12" filter="url(#b14)"/>

  <!-- ======================================================= -->
  <!-- FIGURE 2 — BACKGROUND LEFT (slightly smaller, dimmer)   -->
  <!-- Center ~x=548, head top ~y=88                           -->
  <!-- ======================================================= -->

  <!-- Hair mass (dark) -->
  <ellipse cx="548" cy="96" rx="24" ry="30" fill="#070707"/>
  <path d="M 526 86 Q 515 105 519 138 L 526 135 Q 523 108 533 90 Z" fill="#070707"/>
  <!-- Gold hair catch from upper right -->
  <path d="M 568 76 Q 581 95 578 130 L 572 127 Q 575 95 566 80 Z" fill="#C8980A" opacity="0.52" filter="url(#b1)"/>

  <!-- Head shape -->
  <path d="M 528 85 Q 524 100 524 114 Q 524 138 533 150 Q 540 160 548 162 Q 556 160 563 150 Q 572 138 572 114 Q 572 100 568 85 Q 562 73 548 73 Q 534 73 528 85 Z" fill="#0a0a0a"/>
  <!-- Gold rim light on head right -->
  <path d="M 566 76 Q 578 96 576 120 Q 572 144 562 156 Q 570 142 576 120 Q 580 96 568 74 Z" fill="#C8980A" opacity="0.72"/>

  <!-- Neck -->
  <path d="M 540 160 L 540 176 Q 540 181 542 183 L 554 183 Q 556 181 556 176 L 556 160 Z" fill="#090909"/>
  <path d="M 552 161 Q 558 170 558 183 L 554 183 Q 556 172 554 163 Z" fill="#C8980A" opacity="0.50"/>

  <!-- Left shoulder/arm -->
  <path d="M 506 179 Q 522 168 540 174 L 540 183 L 525 188 Q 508 205 504 242 L 508 280 L 524 264 L 519 238 Q 522 208 536 192 L 540 187 L 540 183 Z" fill="#090909"/>
  <!-- Right shoulder/arm -->
  <path d="M 590 179 Q 574 168 556 174 L 556 183 L 571 188 Q 588 205 592 242 L 588 280 L 572 264 L 577 238 Q 574 208 560 192 L 556 187 L 556 183 Z" fill="#090909"/>
  <!-- Gold rim right shoulder -->
  <path d="M 588 178 Q 602 192 606 232 L 601 272 L 591 251 Q 600 218 598 196 Q 594 185 590 180 Z" fill="#C8980A" opacity="0.74"/>

  <!-- Coat body -->
  <path d="M 508 276 L 499 448 Q 493 510 487 580 L 500 580 Q 506 512 512 452 L 520 280 Z" fill="#080808"/>
  <path d="M 588 276 L 597 448 Q 603 510 609 580 L 596 580 Q 590 512 584 452 L 576 280 Z" fill="#080808"/>
  <!-- Centre coat panel -->
  <rect x="520" y="183" width="56" height="400" fill="#060606"/>
  <!-- Lapels -->
  <path d="M 540 183 L 532 230 L 540 236 L 548 192 Z" fill="#0d0d0d"/>
  <path d="M 556 183 L 564 230 L 556 236 L 548 192 Z" fill="#0d0d0d"/>
  <!-- Gold rim on coat right edge -->
  <path d="M 595 320 L 601 448 L 608 580 L 601 580 L 593 452 L 587 322 Z" fill="#C8980A" opacity="0.44"/>

  <!-- ======================================================= -->
  <!-- FIGURE 1 — FOREGROUND RIGHT (primary subject, dominant) -->
  <!-- Center ~x=700, head top ~y=58                           -->
  <!-- ======================================================= -->

  <!-- Hair (longer, gold-caught from right) -->
  <path d="M 666 72 Q 652 90 656 130 L 664 127 Q 660 94 672 80 Z" fill="#070707"/>
  <ellipse cx="700" cy="70" rx="34" ry="24" fill="#080808"/>
  <!-- Gold caught in hair from upper right -->
  <path d="M 726 58 Q 745 80 743 122 L 736 118 Q 739 82 726 63 Z" fill="#C8980A" opacity="0.68" filter="url(#b1)"/>
  <path d="M 714 50 Q 728 54 736 64 Q 726 58 714 52 Z" fill="#C8980A" opacity="0.82"/>

  <!-- Head shape (larger — foreground) -->
  <path d="M 670 65 Q 666 83 666 108 Q 666 140 677 154 Q 686 166 700 169 Q 714 166 723 154 Q 734 140 734 108 Q 734 83 730 65 Q 722 51 700 51 Q 678 51 670 65 Z" fill="#0b0b0b"/>
  <!-- Strong gold rim on head/face right side -->
  <path d="M 728 58 Q 742 80 742 110 Q 742 140 730 158 Q 740 140 745 110 Q 745 80 730 56 Z" fill="#C8980A" opacity="0.90"/>
  <!-- Very faint fill light on face (opposite cheek) -->
  <path d="M 682 80 Q 678 108 682 130 Q 684 108 686 82 Z" fill="#C8980A" opacity="0.10"/>

  <!-- Neck -->
  <path d="M 688 166 L 688 188 Q 688 194 690 196 L 710 196 Q 712 194 712 188 L 712 166 Q 706 175 700 176 Q 694 175 688 166 Z" fill="#0a0a0a"/>
  <path d="M 708 167 Q 717 177 717 196 L 712 196 Q 714 181 712 169 Z" fill="#C8980A" opacity="0.60"/>

  <!-- Left shoulder / arm -->
  <path d="M 636 192 Q 656 178 688 186 L 690 196 L 672 202 Q 650 222 646 262 L 650 306 L 670 288 L 665 258 Q 668 224 684 206 L 690 200 L 690 196 Z" fill="#0a0a0a"/>
  <!-- Left arm lower -->
  <path d="M 650 306 Q 634 335 630 382 L 634 428 L 648 416 L 645 380 Q 650 338 660 312 Z" fill="#090909"/>
  <!-- Left hand hint -->
  <ellipse cx="632" cy="436" rx="12" ry="9" fill="#0a0a0a" transform="rotate(-15 632 436)"/>

  <!-- Right shoulder (lit side — dominant gold rim) -->
  <path d="M 764 192 Q 744 178 712 186 L 710 196 L 728 202 Q 750 222 754 262 L 750 306 L 730 288 L 735 258 Q 732 224 716 206 L 710 200 L 710 196 Z" fill="#0a0a0a"/>
  <!-- Gold rim on right shoulder (strongest highlight) -->
  <path d="M 762 190 Q 782 206 786 250 L 780 298 L 766 274 Q 778 240 776 212 Q 770 198 764 192 Z" fill="#C8980A" opacity="0.92"/>

  <!-- Right arm lower -->
  <path d="M 754 306 Q 774 337 778 386 L 774 432 L 760 420 L 762 384 Q 758 342 748 312 Z" fill="#0a0a0a"/>
  <!-- Gold rim on right arm lower -->
  <path d="M 772 326 Q 786 358 788 400 L 782 434 L 772 418 Q 780 388 778 352 Z" fill="#C8980A" opacity="0.75"/>

  <!-- Coat main body (long structured fashion coat) -->
  <path d="M 650 302 L 632 482 Q 624 544 618 600 L 636 600 L 644 548 Q 652 488 666 306 Z" fill="#080808"/>
  <path d="M 750 302 L 768 482 Q 776 544 782 600 L 764 600 L 756 548 Q 748 488 734 306 Z" fill="#080808"/>
  <!-- Centre front coat panel -->
  <rect x="666" y="196" width="68" height="404" fill="#050505"/>
  <!-- Lapels (slight lighter tone) -->
  <path d="M 688 196 L 678 250 L 688 258 L 698 208 Z" fill="#0e0e0e"/>
  <path d="M 712 196 L 722 250 L 712 258 L 702 208 Z" fill="#0e0e0e"/>
  <!-- Button / centre seam line -->
  <rect x="698" y="258" width="4" height="345" fill="#0a0a0a"/>

  <!-- Gold rim on coat right side (strong, runs full length) -->
  <path d="M 764 310 L 773 484 L 780 600 L 770 600 L 762 488 L 754 312 Z" fill="#C8980A" opacity="0.60"/>
  <!-- Secondary rim — right coat seam -->
  <path d="M 748 240 L 755 310 L 763 488 L 770 600 L 776 600 L 769 488 L 761 310 L 755 238 Z" fill="#C8980A" opacity="0.28"/>

  <!-- ======================================================= -->
  <!-- LENS FLARE (ANAMORPHIC)                                 -->
  <!-- Horizontal streak at ~y=238 (upper torso / shoulder)    -->
  <!-- ======================================================= -->
  <rect x="0" y="234" width="960" height="2.5"  fill="url(#flare)" opacity="0.95"/>
  <rect x="0" y="236.5" width="960" height="1"  fill="#fff8c0" opacity="0.55"/>
  <rect x="0" y="232" width="960" height="2"    fill="url(#flare)" opacity="0.48"/>
  <!-- Flare bloom at source point -->
  <ellipse cx="728" cy="235" rx="24" ry="6" fill="#fff5a0" opacity="0.58" filter="url(#b3)"/>
  <ellipse cx="704" cy="235" rx="9"  ry="3" fill="#C8980A" opacity="0.65"/>

  <!-- ======================================================= -->
  <!-- VIGNETTE                                                 -->
  <!-- ======================================================= -->
  <rect width="960" height="600" fill="url(#vig)"/>

  <!-- ======================================================= -->
  <!-- FILM GRAIN                                               -->
  <!-- ======================================================= -->
  <rect width="960" height="600" filter="url(#grain)"/>

  <!-- ======================================================= -->
  <!-- LETTERBOX BARS                                           -->
  <!-- ======================================================= -->
  <rect x="0" y="0"   width="960" height="52" fill="#000"/>
  <rect x="0" y="548" width="960" height="52" fill="#000"/>

  <!-- ======================================================= -->
  <!-- GOLD CORNER BRACKETS (cinematic frame accent)           -->
  <!-- ======================================================= -->
  <g stroke="#C8980A" stroke-width="1.5" fill="none" opacity="0.58">
    <path d="M 10,68 L 10,59 L 19,59"/>
    <path d="M 950,68 L 950,59 L 941,59"/>
    <path d="M 10,532 L 10,541 L 19,541"/>
    <path d="M 950,532 L 950,541 L 941,541"/>
  </g>
</svg>
