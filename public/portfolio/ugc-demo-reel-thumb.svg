<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="dg1" cx="68%" cy="32%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c8980a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#090909"/>
  <rect width="1600" height="900" fill="url(#dg1)"/>

  <!-- Left edge gold accent bar -->
  <rect x="0" y="0" width="5" height="900" fill="#c8980a" opacity="0.8"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#ffffff" stroke-width="0.5" opacity="0.025"/>

  <!-- Eyebrow label -->
  <text x="80" y="192"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="17" letter-spacing="7"
    fill="#c8980a" opacity="0.9">UGC VIDEO AD</text>

  <!-- Main display type: PERFOR / MANCE stacked -->
  <text x="80" y="380"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="900" font-size="165" letter-spacing="-5"
    fill="#f5f5f3">PERFOR</text>
  <text x="80" y="554"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="900" font-size="165" letter-spacing="-5"
    fill="#f5f5f3">MANCE</text>

  <!-- Gold word: CREATIVE -->
  <text x="82" y="618"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="42" letter-spacing="14"
    fill="#c8980a">CREATIVE</text>

  <!-- Divider rule -->
  <line x1="80" y1="650" x2="580" y2="650" stroke="#c8980a" stroke-width="1.5" opacity="0.4"/>

  <!-- Subline -->
  <text x="80" y="694"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="20" letter-spacing="5"
    fill="#f5f5f3" opacity="0.35">DEMO REEL · 15 SEC FORMAT</text>

  <!-- Right side: abstract waveform bars -->
  <g transform="translate(1100, 220)" opacity="0.28">
    <rect x="0"   y="100" width="20" height="210" rx="5" fill="#c8980a"/>
    <rect x="30"  y="40"  width="20" height="330" rx="5" fill="#c8980a"/>
    <rect x="60"  y="120" width="20" height="190" rx="5" fill="#c8980a"/>
    <rect x="90"  y="10"  width="20" height="390" rx="5" fill="#c8980a"/>
    <rect x="120" y="70"  width="20" height="270" rx="5" fill="#c8980a"/>
    <rect x="150" y="130" width="20" height="160" rx="5" fill="#c8980a"/>
    <rect x="180" y="50"  width="20" height="310" rx="5" fill="#c8980a"/>
    <rect x="210" y="90"  width="20" height="230" rx="5" fill="#c8980a"/>
    <rect x="240" y="20"  width="20" height="360" rx="5" fill="#c8980a"/>
    <rect x="270" y="80"  width="20" height="250" rx="5" fill="#c8980a"/>
    <rect x="300" y="150" width="20" height="130" rx="5" fill="#c8980a"/>
    <rect x="330" y="55"  width="20" height="290" rx="5" fill="#c8980a"/>
    <rect x="360" y="110" width="20" height="195" rx="5" fill="#c8980a"/>
    <rect x="390" y="30"  width="20" height="350" rx="5" fill="#c8980a"/>
  </g>

  <!-- Bottom label strip -->
  <rect x="0" y="856" width="1600" height="44" fill="#c8980a" opacity="0.065"/>
  <line x1="0" y1="856" x2="1600" y2="856" stroke="#c8980a" stroke-width="1" opacity="0.22"/>
  <text x="80" y="883"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="14" letter-spacing="3"
    fill="#c8980a" opacity="0.65">DREXONYX · INTERNAL PRODUCTION SAMPLE</text>
</svg>
