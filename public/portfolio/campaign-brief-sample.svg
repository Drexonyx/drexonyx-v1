<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="cg1" cx="80%" cy="20%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c8980a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#090909"/>
  <rect width="1600" height="900" fill="url(#cg1)"/>

  <!-- Top gold rule -->
  <rect x="0" y="0" width="1600" height="4" fill="#c8980a" opacity="0.75"/>

  <!-- ── DOCUMENT PANEL ── -->
  <rect x="60" y="40" width="1480" height="818" rx="10"
    fill="#0f0f0f" stroke="#c8980a" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Document header -->
  <rect x="60" y="40" width="1480" height="90" rx="0"
    fill="#c8980a" opacity="0.055"/>
  <rect x="60" y="40" width="5" height="818" rx="0"
    fill="#c8980a" opacity="0.75"/>

  <!-- Header: DREXONYX + BRIEF label -->
  <text x="108" y="96"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="900" font-size="24" letter-spacing="8"
    fill="#c8980a">DREXONYX</text>
  <text x="1500" y="96" text-anchor="end"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="14" letter-spacing="5"
    fill="#f5f5f3" opacity="0.35">CREATIVE STRATEGY BRIEF</text>

  <!-- Divider below header -->
  <line x1="60" y1="130" x2="1540" y2="130" stroke="#c8980a" stroke-width="1" opacity="0.14"/>

  <!-- Campaign title block -->
  <text x="108" y="178"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="300" font-size="13" letter-spacing="5"
    fill="#c8980a" opacity="0.75">CAMPAIGN</text>
  <text x="108" y="222"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="800" font-size="36" letter-spacing="-0.5"
    fill="#f5f5f3">DTC Consumer Brand — Product Launch</text>
  <text x="108" y="256"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="16" letter-spacing="0"
    fill="#f5f5f3" opacity="0.4">TikTok · Instagram Reels · Meta Feed</text>

  <!-- Thin divider -->
  <line x1="108" y1="278" x2="1500" y2="278" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- ── SECTION 1: CAMPAIGN OBJECTIVE ── -->
  <text x="108" y="318"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="11" letter-spacing="5"
    fill="#c8980a" opacity="0.85">01  CAMPAIGN OBJECTIVE</text>
  <text x="108" y="348"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="16"
    fill="#f5f5f3" opacity="0.65">Drive trial and first purchase among 25–40 year old consumers on TikTok and Meta.</text>
  <text x="108" y="372"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="16"
    fill="#f5f5f3" opacity="0.65">Primary KPI: Cost per first purchase. Secondary: thumb-stop rate and scroll-stop rate.</text>

  <!-- Section divider -->
  <line x1="108" y1="396" x2="1500" y2="396" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>

  <!-- ── SECTION 2: CORE CREATIVE CONCEPT ── -->
  <text x="108" y="432"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="11" letter-spacing="5"
    fill="#c8980a" opacity="0.85">02  CORE CREATIVE CONCEPT</text>
  <text x="108" y="462"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="18"
    fill="#f5f5f3" opacity="0.9">"First-Use Feeling" — Creator-led testimonial format anchored in the moment of product discovery.</text>
  <text x="108" y="490"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="15"
    fill="#f5f5f3" opacity="0.5">Authenticity-first visual language. Platform-native framing. Direct benefit communication from frame one.</text>

  <!-- Section divider -->
  <line x1="108" y1="514" x2="1500" y2="514" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>

  <!-- ── SECTION 3: HOOK FRAMEWORK ── -->
  <text x="108" y="550"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="11" letter-spacing="5"
    fill="#c8980a" opacity="0.85">03  HOOK FRAMEWORK</text>

  <!-- Hook 1 -->
  <rect x="108" y="566" width="4" height="34" fill="#c8980a" opacity="0.5"/>
  <text x="124" y="580"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="14"
    fill="#f5f5f3" opacity="0.85">HOOK A — Problem Awareness</text>
  <text x="124" y="598"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="14"
    fill="#f5f5f3" opacity="0.45">"I was spending AED 600 on this... until I found something that actually works."</text>

  <!-- Hook 2 -->
  <rect x="108" y="614" width="4" height="34" fill="#c8980a" opacity="0.5"/>
  <text x="124" y="628"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="14"
    fill="#f5f5f3" opacity="0.85">HOOK B — Social Proof</text>
  <text x="124" y="646"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="14"
    fill="#f5f5f3" opacity="0.45">"I've been recommending this to everyone — here's why..."</text>

  <!-- Hook 3 -->
  <rect x="108" y="662" width="4" height="34" fill="#c8980a" opacity="0.5"/>
  <text x="124" y="676"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="14"
    fill="#f5f5f3" opacity="0.85">HOOK C — Curiosity / Contrast</text>
  <text x="124" y="694"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="14"
    fill="#f5f5f3" opacity="0.45">"Wait — this is what AED 150 actually buys you now?"</text>

  <!-- Section divider -->
  <line x1="108" y1="714" x2="1500" y2="714" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>

  <!-- ── SECTION 4 (truncated preview) ── -->
  <text x="108" y="750"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="11" letter-spacing="5"
    fill="#c8980a" opacity="0.85">04  CTA DIRECTION</text>
  <text x="108" y="778"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="15"
    fill="#f5f5f3" opacity="0.4">"Shop Now" · "Get Yours Today" — first-order offer in caption. Urgency-softened. Non-aggressive.</text>

  <!-- Fade-out gradient — document continues beyond view -->
  <rect x="65" y="790" width="1470" height="62" rx="0"
    fill="url(#doc-fade)"/>
  <defs>
    <linearGradient id="doc-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f0f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f0f0f" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Bottom label strip -->
  <rect x="0" y="856" width="1600" height="44" fill="#c8980a" opacity="0.065"/>
  <line x1="0" y1="856" x2="1600" y2="856" stroke="#c8980a" stroke-width="1" opacity="0.22"/>
  <text x="108" y="883"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="700" font-size="14" letter-spacing="3"
    fill="#c8980a" opacity="0.65">DREXONYX · INTERNAL CREATIVE SAMPLE</text>
  <text x="1500" y="883" text-anchor="end"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="14" letter-spacing="1"
    fill="#f5f5f3" opacity="0.2">Creative Strategy Brief — Demo Document</text>
</svg>
