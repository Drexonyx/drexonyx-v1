<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!--
    Blue geometric accents match the reference brand guide:
    - Lower-left counter of M: the open triangular space between M's left outer
      stroke and M's left inner diagonal stroke (visible open area at bottom-left)
    - Lower-right counter of A: mirrored — the open triangular space at the base
      of A's right outer diagonal stroke
    Both triangles are drawn behind the white text so they show through the
    counter/open areas of the letter forms.
  -->
  <!-- M — lower-left counter accent (right angle at baseline-left) -->
  <polygon points="5,42 5,22 22,42" fill="#0A84FF"/>
  <!-- A — lower-right counter accent (right angle at baseline-right, mirrored) -->
  <polygon points="90,42 90,22 73,42" fill="#0A84FF"/>
  <!-- MDA — all white, heavy bold -->
  <text x="0" y="42"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-weight="800" font-size="38" letter-spacing="-1" fill="#f4f4f5">MDA</text>
  <!-- Blue separator -->
  <rect x="0" y="48" width="106" height="1.5" rx=".75" fill="#0A84FF" opacity=".4"/>
  <!-- MASTER DIGITAL AGENCY descriptor -->
  <text x="0" y="58"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-weight="600" font-size="7.5" letter-spacing="1.5" fill="#71717a">MASTER DIGITAL AGENCY</text>
</svg>
