<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- D: compact blue square in upper D counter -->
  <rect x="40" y="21" width="9" height="9" fill="#0A84FF"/>

  <!-- A upper: apex at (70.5,14), right-pointing to (79,22), widens to crossbar x=64-84 -->
  <polygon points="70.5,14 79,22 84,31 64,31" fill="#5AAEFF"/>

  <!-- A lower right: darker blue fills right leg opening (y=31-42, right side) -->
  <polygon points="72,31 84,31 83,42 68,42" fill="#0A84FF"/>

  <!-- MDA text (on top) -->
  <text x="0" y="42"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-weight="900" font-size="38" letter-spacing="-1" fill="#f4f4f5">MDA</text>

  <!-- Separator -->
  <rect x="0" y="48" width="129" height="1" rx=".5" fill="#f4f4f5" opacity=".45"/>

  <!-- MASTER DIGITAL AGENCY -->
  <text x="0" y="58"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-weight="600" font-size="7.5" letter-spacing="1.5" fill="#a1a1aa">MASTER DIGITAL AGENCY</text>
</svg>
